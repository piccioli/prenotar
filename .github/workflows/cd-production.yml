name: CD Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy in produzione
    runs-on: [self-hosted, production]

    env:
      BACKUP_DIR: /var/backups/prenotar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup database pre-deploy
        run: |
          mkdir -p "${BACKUP_DIR}"
          timestamp=$(date +%Y%m%d-%H%M%S)
          docker compose -f docker-compose.production.yml exec -T mariadb sh -c \
            'mariadb-dump -u root -p"$MARIADB_ROOT_PASSWORD" "$MARIADB_DATABASE"' \
            > "${BACKUP_DIR}/prenotar-${timestamp}.sql"

      - name: Retention backup (mantieni solo gli ultimi 5)
        run: |
          cd "${BACKUP_DIR}"
          ls -t prenotar-*.sql | tail -n +6 | xargs -r rm --

      - name: Build immagine produzione
        run: docker compose -f docker-compose.production.yml build

      - name: Avvio stack produzione
        run: docker compose -f docker-compose.production.yml up -d

      - name: Migrazioni database
        run: docker compose -f docker-compose.production.yml exec -T app php artisan migrate --force
