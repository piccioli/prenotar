# Stack produzione Prenotar (Nginx + PHP-FPM + MariaDB + Redis + worker + scheduler).
# Sviluppo Docker: in `.env` imposta `COMPOSER_INSTALL_DEV=1` (Composer con dev deps, es. Faker per seed demo) e `APP_ENV=local`.
# Uso: copia .env.production.example in .env, valorizza segreti e DB_*, poi:
#   docker compose -p prenotar -f docker-compose.production.yml build
#   docker compose -p prenotar -f docker-compose.production.yml up -d
# Prima installazione DB: docker compose -p prenotar -f docker-compose.production.yml exec app php artisan migrate --force
# NB: usare sempre `-p prenotar` esplicito — se manca, Docker Compose deriva il project name dalla
# directory (uguale per lo stack develop), causando collisioni tra i due stack sullo stesso host.

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
      args:
        COMPOSER_INSTALL_DEV: ${COMPOSER_INSTALL_DEV:-0}
    ports:
      - "${HTTP_PUBLISH:-80}:80"
      - "${HTTPS_PUBLISH:-443}:443"
    environment:
      CERTBOT_DOMAIN: "${CERTBOT_DOMAIN:-}"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped

  # Non parte con `up` (profile `tools`). Uso: richiesta certificato e rinnovi — vedi DEPLOY.md e scripts/certbot-*.sh
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - tools

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        COMPOSER_INSTALL_DEV: ${COMPOSER_INSTALL_DEV:-0}
    env_file:
      - .env
    environment:
      AUTORUN_OPTIMIZE: "${AUTORUN_OPTIMIZE:-1}"
      AUTORUN_MIGRATIONS: "${AUTORUN_MIGRATIONS:-0}"
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        COMPOSER_INSTALL_DEV: ${COMPOSER_INSTALL_DEV:-0}
    entrypoint: ["/usr/local/bin/docker-entrypoint-worker.sh"]
    command: [php, artisan, horizon]
    env_file:
      - .env
    environment:
      AUTORUN_OPTIMIZE: "0"
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        COMPOSER_INSTALL_DEV: ${COMPOSER_INSTALL_DEV:-0}
    entrypoint: ["/usr/local/bin/docker-entrypoint-worker.sh"]
    command: [php, artisan, schedule:work]
    env_file:
      - .env
    environment:
      AUTORUN_OPTIMIZE: "0"
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${DB_DATABASE}"
      MARIADB_USER: "${DB_USERNAME}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:
  app_storage:
  # Condivisi con docker-compose.develop.yml: solo produzione pubblica la porta 80/443 dell'host,
  # quindi l'emissione/rinnovo Certbot per ENTRAMBI i domini passa da questo stack (vedi scripts/certbot-*.sh
  # e DEPLOY.md, sezione "HTTPS con Certbot"). Volume esterno, creato una tantum sul server:
  #   docker volume create prenotar_shared_certbot_conf
  #   docker volume create prenotar_shared_certbot_www
  certbot_conf:
    external: true
    name: prenotar_shared_certbot_conf
  certbot_www:
    external: true
    name: prenotar_shared_certbot_www
